name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Checkstyle, unit tests, ArchUnit rules and the Karate acceptance suite
      # (Postgres and Kafka via Testcontainers, Docker is preinstalled on the runner).
      - name: Build and test
        run: ./gradlew build

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            savings-service/build/reports/
            savings-service/build/karate-reports/
            transfer-service/build/reports/
            transfer-service/build/karate-reports/
            current-account-service/build/reports/
            platform-messaging/build/reports/
            current-account-service/build/karate-reports/
