spring:
  application:
    name: savings-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/savings}
    username: ${DB_USER:savings}
    password: ${DB_PASSWORD:savings}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema, Hibernate only checks it
    properties:
      hibernate.jdbc.time_zone: UTC
      # ledger_entry is a partitioned table; without this, schema validation can't "see" it
      hibernate.hbm2ddl.extra_physical_table_types: PARTITIONED TABLE
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: savings-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: savings-service

savings:
  business-zone: Europe/Berlin
  hold-ttl: 72h
  topics:
    payment-instructions: payments.savings-instructions.v1
    account-events: savings.account-events.v1
    postings: savings.postings.v1
    partitions: 3
  outbox:
    poll-interval-ms: 200
    batch-size: 100
  jobs:
    interest-accrual-cron: "0 15 0 * * *"      # 00:15 Berlin time, after the day is complete
    hold-expiry-cron: "0 * * * * *"            # every minute
    partition-maintenance-cron: "0 0 3 * * *"
