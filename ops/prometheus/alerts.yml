groups:
  - name: savings
    rules:
      - alert: SavingsInstructionDeadLettered
        # An instruction from Payments could not be applied and was parked on the dead-letter topic.
        # Nothing is lost, but the money is not where Payments believes it is until someone inspects,
        # fixes and replays it (runbook: ADR 0007).
        expr: increase(savings_messages_dead_lettered_total[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} payment instructions were dead-lettered on {{ $labels.topic }}"

      - alert: SavingsOutboxBacklog
        # Events are committed but not reaching Kafka (broker down, relay stuck, lock not released).
        expr: savings_outbox_pending > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} account events waiting in the outbox"

      - alert: SavingsInterestBehind
        # Some account hasn't accrued yesterday's interest long after the nightly run (00:15 Berlin):
        # the run didn't happen or didn't finish, or an account fails every night. Customers are owed
        # interest that isn't booked (runbook: ADR 0010; the job log names the failing accounts).
        expr: max(savings_interest_accrual_lag_days) > 0
        for: 6h
        labels:
          severity: page
        annotations:
          summary: "Interest is {{ $value }} day(s) behind for at least one account"

      - alert: SavingsInterestAccrualFailed
        # An account's accrual failed with something other than a lock conflict. The job went on with
        # the other accounts and the next run retries it; SavingsInterestBehind pages if it keeps failing.
        expr: increase(savings_interest_accrual_failed_total[1h]) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} accounts failed to accrue interest"

      - alert: SavingsConsumerLag
        expr: max(kafka_consumer_fetch_manager_records_lag_max{application="savings-service"}) > 1000
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Savings is falling behind on payment instructions"
