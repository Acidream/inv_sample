groups:
  - name: savings
    rules:
      - alert: SavingsInstructionDeadLettered
        # An instruction from Payments could not be applied and was parked on the dead-letter topic.
        # Nothing is lost, but the money is not where Payments believes it is until someone inspects,
        # fixes and replays it (runbook: ADR 0007).
        expr: increase(savings_messages_dead_lettered_total[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} payment instructions were dead-lettered on {{ $labels.topic }}"

      - alert: SavingsOutboxBacklog
        # Events are committed but not reaching Kafka (broker down, relay stuck, lock not released).
        expr: savings_outbox_pending > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} account events waiting in the outbox"

      - alert: SavingsConsumerLag
        expr: max(kafka_consumer_fetch_manager_records_lag_max{application="savings-service"}) > 1000
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "Savings is falling behind on payment instructions"
