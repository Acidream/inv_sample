groups:
  - name: savings
    rules:
      - alert: MessageDeadLettered
        # A message could not be applied and was parked on the dead-letter topic, in any service.
        # Nothing is lost, but the money is not where the sender believes it is until someone
        # inspects, fixes and replays it (runbook: ADR 0007).
        expr: increase(messages_dead_lettered_total[10m]) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} messages were dead-lettered by {{ $labels.application }} from {{ $labels.topic }}"

      - alert: OutboxBacklog
        # Messages are committed but not reaching Kafka (broker down, relay stuck, lock not released).
        expr: outbox_pending > 100
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} messages waiting in the outbox of {{ $labels.application }}"

      - alert: SavingsInterestBehind
        # Some account hasn't accrued yesterday's interest long after the nightly run (00:15 Berlin):
        # the run didn't happen or didn't finish, or an account fails every night. Customers are owed
        # interest that isn't booked (runbook: ADR 0010; the job log names the failing accounts).
        expr: max(savings_interest_accrual_lag_days) > 0
        for: 6h
        labels:
          severity: page
        annotations:
          summary: "Interest is {{ $value }} day(s) behind for at least one account"

      - alert: SavingsInterestAccrualFailed
        # An account's accrual failed with something other than a lock conflict. The job went on with
        # the other accounts and the next run retries it; SavingsInterestBehind pages if it keeps failing.
        expr: increase(savings_interest_accrual_failed_total[1h]) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} accounts failed to accrue interest"

      - alert: ConsumerBlocked
        # A consumer thread's lag hasn't been zero once in 15 minutes: a message is retried without end
        # (ADR 0007) and blocks its partition, or the service can't keep up at all. Every service.
        expr: max by (application) (min_over_time(kafka_consumer_fetch_manager_records_lag_max[15m])) > 0
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.application }} has not caught up on a partition for 15 minutes"

      - alert: ConsumerLag
        expr: max by (application) (kafka_consumer_fetch_manager_records_lag_max) > 1000
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: "{{ $labels.application }} is {{ $value }} messages behind"

      - alert: TransferStuck
        # A transfer has waited longer than transfers.stuck-after for a ledger's answer (ADR 0023): an
        # instruction or an answer was dead-lettered, or a bug. Money may sit on transfer-clearing.
        expr: max(transfers_stuck) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "{{ $value }} transfers are waiting too long for a ledger's answer"

      - alert: InvestmentOrderOverdue
        # An order is still with the broker an hour after its trading day ended (ADR 0027). The broker
        # expires every market order at the end of its day, so a report was lost or the gateway is
        # stuck: the customer's money is in flight on the portfolio.
        expr: max(investments_orders_overdue) > 0 or max(gateway_orders_overdue) > 0
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "Orders are still open after their trading day ended"

      - alert: InvestmentPayoutUnpaid
        # The current account has refused a refund or proceeds for more than three days (ADR 0026): the
        # customer's money rests on a portfolio. Retries run daily and when the account is unblocked.
        expr: max(investments_payouts_unpaid_overdue) > 0
        labels:
          severity: warn
        annotations:
          summary: "{{ $value }} payouts unpaid for more than three days"

      - alert: FixSessionDown
        # No instance holds a logged-on FIX session to the broker on a weekday (ADR 0027). Orders wait in
        # the gateway, and expire unsent if their trading day ends first.
        expr: (sum(fix_session_logged_on) or vector(0)) == 0 and on() day_of_week() >= 1 and on() day_of_week() <= 5
        for: 5m
        labels:
          severity: page
        annotations:
          summary: "The FIX session to the broker is down"
