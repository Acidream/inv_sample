syntax = "proto3";

package payments.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.example.events.payments.v1";

// Topic: payments.savings-instructions.v1 (owned by the Payments team, which orchestrates transfers
//        between a customer's current account and savings account).
//        The same message goes to investments on payments.investment-instructions.v1, where
//        account_id is the portfolio id (ADR 0028).
// Key:   account_id. Producers MUST key by account so that all instructions
//        for one account land on one partition and are consumed in order.
//
// Savings only ever moves money to and from the customer's own current account. External payments
// (SPEI, SEPA, cards) are made from the current account and never reach Savings.
//
// Evolution rules: additive only. Never change or reuse a field number;
// reserve numbers of removed fields.
message PaymentInstruction {
  string event_id = 1;                         // unique per message, used for de-duplication
  google.protobuf.Timestamp occurred_at = 2;
  string account_id = 3;                       // UUID of the savings account

  oneof payload {
    TransferFromCurrentAccount transfer_from_current_account = 10;
    TransferToCurrentAccount transfer_to_current_account = 11;
    TransferReturned transfer_returned = 12;
  }
}

// The current account has already been debited: credit the savings account.
// Answered with MoneyDeposited.
message TransferFromCurrentAccount {
  string transfer_id = 1;                      // unique per transfer, chosen by Payments
  common.v1.Money amount = 2;
}

// Move money to the current account. Savings debits immediately if the balance allows it.
// Answered with MoneyWithdrawn (then Payments credits the current account) or WithdrawalRejected.
message TransferToCurrentAccount {
  string transfer_id = 1;
  common.v1.Money amount = 2;
}

// Compensation: the current account could not be credited for an earlier TransferToCurrentAccount
// (e.g. it was closed). Savings credits the money back. Answered with WithdrawalReturned.
message TransferReturned {
  string transfer_id = 1;
}
