syntax = "proto3";

package savings.v1;

import "common.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.example.events.savings.v1";

// Topic: savings.account-events.v1 (owned by the Savings team).
// Key:   account_id. Events of one account are published in order.
// Delivery is at-least-once: consumers must de-duplicate on event_id.
//
// Every transfer instruction gets exactly one answer, carrying its transfer_id:
//   TransferFromCurrentAccount -> MoneyDeposited
//   TransferToCurrentAccount   -> MoneyWithdrawn | WithdrawalRejected
//   TransferReturned           -> WithdrawalReturned
message AccountEvent {
  string event_id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string account_id = 3;

  oneof payload {
    AccountOpened account_opened = 10;
    MoneyDeposited money_deposited = 11;
    MoneyWithdrawn money_withdrawn = 12;
    WithdrawalRejected withdrawal_rejected = 13;
    WithdrawalReturned withdrawal_returned = 14;
    InterestPaid interest_paid = 15;
  }
}

// The account was opened on one version of a savings product and keeps its terms for life.
message AccountOpened {
  enum PayoutFrequency {
    PAYOUT_FREQUENCY_UNSPECIFIED = 0;
    MONTHLY = 1;
    QUARTERLY = 2;
    YEARLY = 3;
  }
  string customer_id = 1;
  string annual_rate = 2;          // decimal fraction, e.g. "0.0250" = 2.5 % p.a.; the product version's rate
  string product_code = 3;         // e.g. "INSTANT_ACCESS"
  int32 product_version = 4;
  PayoutFrequency payout_frequency = 5;
}

message MoneyDeposited {
  string transfer_id = 1;
  common.v1.Money amount = 2;
  common.v1.Money balance = 3;
}

// The savings account was debited; Payments now credits the current account.
message MoneyWithdrawn {
  string transfer_id = 1;
  common.v1.Money amount = 2;
  common.v1.Money balance = 3;
}

message WithdrawalRejected {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    INSUFFICIENT_FUNDS = 1;
  }
  string transfer_id = 1;
  common.v1.Money amount = 2;
  Reason reason = 3;
}

// A withdrawal the current account could not accept was credited back.
message WithdrawalReturned {
  string transfer_id = 1;
  common.v1.Money amount = 2;
  common.v1.Money balance = 3;
}

// Interest earned over one payout period of the account's product was credited.
message InterestPaid {
  string period = 1;               // "2026-10" (monthly), "2026-Q4" (quarterly) or "2026" (yearly)
  common.v1.Money amount = 2;
  common.v1.Money balance = 3;
  string period_start = 4;         // ISO date, first day of the period (Europe/Berlin)
  string period_end = 5;           // ISO date, last day of the period, inclusive
}
