server:
  port: 8083

spring:
  application:
    name: investment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/investments}
    username: ${DB_USER:investments}
    password: ${DB_PASSWORD:investments}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: investment-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record
      concurrency: ${investments.topics.partitions}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: investment-service

investments:
  topics:
    commands: investments.commands.v1
    instructions: payments.investment-instructions.v1
    account-events: investments.account-events.v1
    transfer-requests: payments.transfer-requests.v1
    transfer-events: payments.transfer-events.v1
    current-account-events: current-account.events.v1
    broker-orders: broker.orders.v1
    broker-executions: broker.executions.v1
    postings: investments.postings.v1
    partitions: 3
  overdue-after: 1h
  unpaid-alert-after: 3d
  jobs:
    unpaid-payouts-cron: "0 0 6 * * *"
# Outbox relay and retention: platform-messaging's defaults (platform.messaging.*).
