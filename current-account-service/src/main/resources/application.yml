server:
  port: 8082

spring:
  application:
    name: current-account-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/current_accounts}
    username: ${DB_USER:current_accounts}
    password: ${DB_PASSWORD:current_accounts}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: current-account-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
    listener:
      ack-mode: record
      concurrency: ${current-account.topics.partitions}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: current-account-service

current-account:
  topics:
    commands: current-account.commands.v1
    instructions: payments.current-account-instructions.v1
    events: current-account.events.v1
    partitions: 3
  outbox:
    poll-interval-ms: 200
    batch-size: 100
