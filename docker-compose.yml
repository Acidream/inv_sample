# Local stack: ./gradlew bootJar && docker compose up --build
#   Savings    http://localhost:8080/swagger-ui.html
#   Transfers  http://localhost:8081/swagger-ui.html
#   Current accounts http://localhost:8082/swagger-ui.html
#   Prometheus http://localhost:9090   (alerts: /alerts)
#   Grafana    http://localhost:3000   (anonymous viewer, dashboard "Savings")
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: savings
      POSTGRES_USER: savings
      POSTGRES_PASSWORD: savings
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savings"]
      interval: 2s
      retries: 30

  # The transfer service owns its data: a database of its own (ADR 0018).
  transfers-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transfers
      POSTGRES_USER: transfers
      POSTGRES_PASSWORD: transfers
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfers"]
      interval: 2s
      retries: 30

  # The current account service owns its data too.
  current-accounts-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: current_accounts
      POSTGRES_USER: current_accounts
      POSTGRES_PASSWORD: current_accounts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U current_accounts"]
      interval: 2s
      retries: 30

  kafka:
    image: apache/kafka:4.0.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 5s
      retries: 30

  savings-service:
    build: ./savings-service
    ports: ["8080:8080"]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/savings
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  transfer-service:
    build: ./transfer-service
    ports: ["8081:8081"]
    environment:
      DB_URL: jdbc:postgresql://transfers-db:5432/transfers
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      transfers-db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  current-account-service:
    build: ./current-account-service
    ports: ["8082:8082"]
    environment:
      DB_URL: jdbc:postgresql://current-accounts-db:5432/current_accounts
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      current-accounts-db: { condition: service_healthy }
      kafka: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:11.5.2
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
